<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MindReflect</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f14" />

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f14;
  --surface:#17171f;
  --surface2:#1e1e28;
  --border:rgba(255,255,255,0.07);
  --accent:#7c9fff;
  --accent2:#b89dff;
  --text:#e8e8f0;
  --muted:#6b6b80;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}

.logo{
  font-family:'Playfair Display',serif;
  font-size:1.4rem;
  font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.lang-switcher button{
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  padding:5px 10px;
  border-radius:20px;
  font-size:0.75rem;
  cursor:pointer;
  margin-left:5px;
}

.lang-switcher button.active{
  border-color:var(--accent);
  color:var(--accent);
}

.tabs{
  display:flex;
  background:var(--surface);
  overflow-x:auto;
}

.tab{
  padding:14px;
  cursor:pointer;
  color:var(--muted);
  border-bottom:2px solid transparent;
}

.tab.active{
  color:var(--accent);
  border-bottom-color:var(--accent);
}

.content{
  padding:20px;
  max-width:800px;
  margin:auto;
}

.panel{display:none}
.panel.active{display:block}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
}

textarea{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
  color:var(--text);
  resize:vertical;
  min-height:120px;
}

button.primary{
  margin-top:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.home-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.tile{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  cursor:pointer;
}
.tile:hover{
  border-color:var(--accent);
}
</style>
</head>

<body>

<header>
  <div class="logo">MindReflect</div>

  <div class="lang-switcher">
    <button onclick="setLang('de')" id="btn-de">DE</button>
    <button onclick="setLang('en')" id="btn-en">EN</button>
    <button onclick="setLang('pl')" id="btn-pl">PL</button>
    <button onclick="setLang('es')" id="btn-es">ES</button>
    <button onclick="setLang('ru')" id="btn-ru">RU</button>
    <button onclick="setLang('zh')" id="btn-zh">ZH</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab('home',this)">🏠 Start</div>
  <div class="tab" onclick="showTab('journal',this)">📓 Journal</div>
  <div class="tab" onclick="showTab('cbt',this)">🧠 CBT</div>
  <div class="tab" onclick="showTab('settings',this)">⚙️ Settings</div>
</div>

<div class="content">

<div class="panel active" id="home">
  <h2>Willkommen</h2>
  <div class="home-grid">
    <div class="tile" onclick="goTab(1)">📓 Tagebuch</div>
    <div class="tile" onclick="goTab(2)">🧠 CBT Übungen</div>
    <div class="tile" onclick="goTab(3)">⚙️ Einstellungen</div>
  </div>
</div>

<div class="panel" id="journal">
  <div class="card">
    <h3>Tagesreflexion</h3>
    <textarea id="journalInput" placeholder="Wie war dein Tag?"></textarea>
    <button class="primary" onclick="saveEntry()">Speichern</button>
  </div>
  <div class="card">
    <h3>Letzte Einträge</h3>
    <div id="entries"></div>
  </div>
</div>

<div class="panel" id="cbt">
  <div class="card">
    <h3>CBT Übung</h3>
    <textarea placeholder="Beschreibe eine Situation..."></textarea>
  </div>
</div>

<div class="panel" id="settings">
  <div class="card">
    <h3>Einstellungen</h3>
    Sprache wird automatisch gespeichert.
  </div>
</div>

</div>

<script>

let entries = JSON.parse(localStorage.getItem('entries')||'[]');

function showTab(id,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

function goTab(index){
  document.querySelectorAll('.tab')[index].click();
}

function saveEntry(){
  const text=document.getElementById('journalInput').value.trim();
  if(!text)return;
  entries.unshift({text,date:new Date().toLocaleDateString()});
  localStorage.setItem('entries',JSON.stringify(entries));
  document.getElementById('journalInput').value='';
  renderEntries();
}

function renderEntries(){
  const list=document.getElementById('entries');
  list.innerHTML='';
  entries.slice(0,5).forEach(e=>{
    list.innerHTML+=`<div style="margin-bottom:8px;color:var(--muted);">${e.date}<br>${e.text}</div>`;
  });
}

function setLang(lang){
  localStorage.setItem('lang',lang);
  document.querySelectorAll('.lang-switcher button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+lang).classList.add('active');
}

document.addEventListener('DOMContentLoaded',()=>{
  renderEntries();
  const savedLang=localStorage.getItem('lang')||'de';
  setLang(savedLang);
});

</script>

</body>
</html>
