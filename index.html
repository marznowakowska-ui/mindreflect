<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindReflect</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f14">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0f0f14;
--surface:#17171f;
--border:rgba(255,255,255,.08);
--text:#e8e8f0;
--muted:#8b8ba6;
--accent:#7c9fff;
--accent2:#b89dff;
--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:"DM Sans",sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
}
header{
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--border);
}
.brand{
font-family:"Playfair Display",serif;
font-size:1.6rem;
background:linear-gradient(135deg,var(--accent),var(--accent2));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.langbar{display:flex;gap:8px}
.lang-btn{
padding:6px 10px;
border-radius:999px;
border:1px solid var(--border);
background:rgba(255,255,255,.05);
color:var(--muted);
cursor:pointer;
font-size:.8rem;
}
.lang-btn.active{
background:rgba(124,159,255,.2);
color:var(--text);
}

main{padding:20px 16px 100px}

h1{
font-family:"Playfair Display",serif;
margin-bottom:10px;
}

.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:var(--radius);
padding:16px;
margin-bottom:16px;
}

textarea{
width:100%;
min-height:120px;
padding:12px;
border-radius:14px;
border:1px solid var(--border);
background:#1f1f2b;
color:var(--text);
margin-top:10px;
resize:vertical;
}

button{
margin-top:12px;
width:100%;
padding:12px;
border:none;
border-radius:14px;
font-weight:600;
cursor:pointer;
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:#0f0f14;
}

.ai{
margin-top:14px;
padding:14px;
border-radius:14px;
background:rgba(124,159,255,.1);
border:1px solid rgba(124,159,255,.3);
display:none;
}

.ai.visible{display:block}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
background:#12121a;
border-top:1px solid var(--border);
}
.nav-btn{
flex:1;
padding:12px;
text-align:center;
color:var(--muted);
cursor:pointer;
}
.nav-btn.active{
color:var(--text);
background:rgba(124,159,255,.1);
}
</style>
</head>

<body>

<header>
<div class="brand">MindReflect</div>
<div class="langbar" id="langbar"></div>
</header>

<main>

<section id="start">
<h1>Willkommen</h1>
<div class="card">
Wähle unten einen Bereich.
</div>
</section>

<section id="journal" style="display:none">
<h1>Tagebuch</h1>
<div class="card">
<textarea id="journalInput" placeholder="Wie war dein Tag?"></textarea>
<button onclick="runJournal()">Reflektieren</button>
<div class="ai" id="journalAI"></div>
</div>
</section>

<section id="focus" style="display:none">
<h1>Schwerpunkte</h1>
<div class="card">
<textarea id="focusInput" placeholder="Beschreibe dein Thema..."></textarea>
<button onclick="runFocus()">Reflektieren</button>
<div class="ai" id="focusAI"></div>
</div>
</section>

</main>

<nav>
<div class="nav-btn active" onclick="go('start',this)">Start</div>
<div class="nav-btn" onclick="go('journal',this)">Journal</div>
<div class="nav-btn" onclick="go('focus',this)">Fokus</div>
</nav>

<script>
let lang="de";

const LANGS=["de","en","pl","es","ru","zh"];

function renderLang(){
const bar=document.getElementById("langbar");
bar.innerHTML="";
LANGS.forEach(l=>{
const b=document.createElement("div");
b.className="lang-btn"+(l===lang?" active":"");
b.textContent=l.toUpperCase();
b.onclick=()=>{lang=l;renderLang();}
bar.appendChild(b);
});
}
renderLang();

function go(id,el){
document.querySelectorAll("main section").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
el.classList.add("active");
}

async function callAI(text){
const res=await fetch("/.netlify/functions/reflect",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text,lang})
});
const data=await res.json();
return data.output||"Fehler";
}

async function runJournal(){
const text=document.getElementById("journalInput").value;
if(!text)return;
const ai=document.getElementById("journalAI");
ai.classList.remove("visible");
ai.textContent="KI denkt...";
const out=await callAI(text);
ai.textContent=out;
ai.classList.add("visible");
}

async function runFocus(){
const text=document.getElementById("focusInput").value;
if(!text)return;
const ai=document.getElementById("focusAI");
ai.classList.remove("visible");
ai.textContent="KI denkt...";
const out=await callAI(text);
ai.textContent=out;
ai.classList.add("visible");
}
</script>

</body>
</html>
